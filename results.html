<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Music Analysis Results</title>
</head>
<body>
  <h2>Analyzed Tracks</h2>
  <div id="resultsList">Loading...</div>

  <script>
    const API_URL = (
      window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    )
      ? "http://localhost:8080/results-json"
      : "https://music-backend-785098527240.europe-west1.run.app/results-json";

    async function loadResults() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          throw new Error("Failed to fetch results");
        }
        const data = await response.json();
        renderResults(data);
      } catch (err) {
        console.error(err);
        document.getElementById("resultsList").innerText = "Error loading results.";
      }
    }

    function renderResults(tracks) {
      if (!tracks || !tracks.length) {
        document.getElementById("resultsList").innerText = "No tracks analyzed yet.";
        return;
      }

      let html = "<ul>";
      for (const track of tracks) {
        html += `
          <li>
            <strong>${track.filename || track.originalName || "Unknown file"}</strong><br/>
            BPM: ${track.bpm ?? "Not available"} | Key: ${track.key ?? "Not available"} <br/>
            Energy: ${track.energy ?? "Not available"} | 
            Loudness: ${track.loudness ?? "Not available"} | 
            Danceability: ${track.danceability ?? "Not available"}<br/>
            Spectral Centroid: ${track.spectral_centroid ?? "Not available"} | 
            Bandwidth: ${track.spectral_bandwidth ?? "Not available"} | 
            Rolloff: ${track.spectral_rolloff ?? "Not available"}
          </li><br/>
        `;
      }
      html += "</ul>";

      document.getElementById("resultsList").innerHTML = html;
    }

    loadResults();
  </script>
</body>
</html>
